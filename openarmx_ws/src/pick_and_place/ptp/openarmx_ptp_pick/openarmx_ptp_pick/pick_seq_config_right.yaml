# 오른팔 pick 시퀀스 설정 — ptp_pick_seq_v2_left.py --side=right 가 로드.
# 코드 수정 없이 이 파일만 고쳐 튜닝한다. 왼팔과 별도 구동.

# 파지 위치 보정 오프셋 [m]. 검출 박스 위치(openarmx_body_link0)에 더해짐.
# !! 방향 유의 !!
#  - x(전방)은 body_link0 공통축이라 왼팔과 동일 부호(+) 시작값 0.015 로 둠.
#  - y 는 오른팔 그리퍼가 좌우 미러라 바이어스가 반대일 수 있음 -> 실측 후 보정.
#    (왼팔에서 X만 튜닝했으므로 우선 0, 라이브 검증하며 조정)
grasp_offset:
  x: 0.015
  y: 0.0
  z: 0.0

# 접근/하강 높이 (Z 상방, 프레임 공통이라 왼팔과 동일)
approach_z: 0.87
descend_z: 0.75
